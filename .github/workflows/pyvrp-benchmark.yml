name: Isolated PyVRP benchmark
on:
  push:
    branches: [benchmark/pyvrp-verification]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyvrp==0.14.1
      - run: node benchmarks/prepare-workspace.test.cjs
      - run: python benchmarks/pyvrp_verify.py
      - run: >-
          python -m pip download --only-binary=:all: --platform win_amd64 --python-version 313 --implementation cp --abi cp313 --dest windows-wheels pyvrp==0.14.1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-pyvrp-wheels
          path: windows-wheels
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-pyvrp-results
          path: benchmark-results.json
