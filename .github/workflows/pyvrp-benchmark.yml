name: Isolated PyVRP benchmark
on:
  push:
    branches: [benchmark/pyvrp-verification]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyvrp==0.14.1
      - run: node benchmarks/prepare-workspace.test.cjs
      - run: python benchmarks/pyvrp_verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-pyvrp-results
          path: benchmark-results.json
